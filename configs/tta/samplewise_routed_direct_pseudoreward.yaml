protocol: samplewise_transductive_continual_ttt
passes: 1
update_before_predict: true
max_optimizer_steps_per_sample: 1
teacher:
  frozen: true
  beam_size: 10
  pseudo: top1
  update_gate: [rdkit_valid, observed_formula_exact]
router:
  frozen: true
  formula_always_retained: true
  routed_modalities: [HNMR, CNMR, MSMS, IR]
  actions: 15_nonempty_subsets
student:
  trainable: all_parameters
  official_prediction_input: [Formula, HNMR, CNMR, MSMS, IR]
  official_prediction_beam_size: 10
objective:
  full: length_normalized_pseudo_sequence_nll
  subset: length_normalized_pseudo_sequence_nll
  subset_weight: 0.5
dropout:
  mode: block_balanced_independent
  actions: 14_nonempty_nonfull_subsets
  skip_does_not_advance: true
optimization:
  optimizer: AdamW
  learning_rate: 3.0e-6
  stability_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  gradient_clip: 1.0
  forward_precision: bf16
  loss_statistics_precision: fp32
  reset_between_samples: false
forbidden_online_inputs: [target_smiles, inchi, inchikey]
forbidden_paths: [student_sampling, candidate_group, relative_advantage, policy_gradient, rerank]
