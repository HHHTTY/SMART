model_type: CustomModel
model_name: facebook/bart-base
d_model: 512
num_heads: 8
encoder_attention_heads: 8
decoder_attention_heads: 8
encoder_layers: 6
decoder_layers: 6
encoder_ffn_dim: 2048
decoder_ffn_dim: 2048
multimodal_norm: true
final_layer_norm: true
positional_encoding_type: learned
gated_linear: true
post_layer_normalisation: true

optimiser: adamw
lr: 1e-3
lr_scheduler: cyclic
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.999

model_checkpoint_path: null
# Effective batch size follows the paper's 128; physical batch is reduced for
# the longer MS input and recovered with gradient accumulation.
batch_size: 8
cv_split: 0
guided_generation: false
max_position_embeddings: 2048

align_config: null
multitask_retrieval_config: null
generation_fusion_config: null
n_beams: 1
validation_n_beams: 1
validation_guided_generation: false
rejection_sampling: false

# Shared-encoder transfer of the TAHCD idea.  Formula/CNMR are used as the
# observed anchor; the fast state is reset for every molecule at inference.
tahcd_config:
  enabled: false
  inference_ttt_enabled: false
  apply_no_update: true
  update_steps: 1
  adaptation_lr: 0.5
  ttce_enabled: true
  ttce_weight: 1.0
  consistency_weight: 0.25
  prior_weight: 0.01
  slack: 0.10
  max_alpha: 0.50
  min_alpha: -0.50
  distance_temperature: 0.10
  modalities: [HNMR, MSMS, IR]
  anchor_modalities: [Formula, CNMR]
  modality_map:
    Formula: Formula
    HNMR: HNMR
    CNMR: CNMR
    MSMS: MSMS
    IR: IR
  unit_structure:
    HNMR:
      special_ids: [0, 1, 2, 3]
      prefix_ids: [10]
      delimiter_ids: [4]
      delimiter_terminated: true
    MSMS:
      special_ids: [0, 1, 2, 3]
      header_ids: [5, 6, 7, 8, 9, 10]
      record_width: 2

# Hierarchical spectral repair design. Disabled in the legacy baseline YAML;
# enable explicitly for the strict spectral-repair experiments.
spectral_repair_config:
  enabled: false
  inference_tta_enabled: false
  apply_no_update: true
  update_steps: 1
  adaptation_lr: 0.5
  rank: 32
  relation_dim: 32
  fast_dim: 8
  gate_hidden: 64
  min_gate: 0.05
  max_fast_scale: 0.05
  max_calibration_ratio: 0.10
  mask_stride: 4
  maskpred_weight: 1.0
  slack_weight: 1.0
  trust_weight: 0.01
  modalities: [HNMR, MSMS, IR]
  anchor_modalities: [Formula, CNMR]
  modality_map:
    Formula: Formula
    HNMR: HNMR
    CNMR: CNMR
    MSMS: MSMS
    IR: IR
