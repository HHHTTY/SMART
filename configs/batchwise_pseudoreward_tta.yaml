protocol: continual_online_tta
passes: 1
batch_size: 16
steps_per_batch: 1
teacher:
  checkpoint: epoch_24-step_122175.ckpt
  frozen: true
  beams: 10
  formula_always_retained: true
router:
  actions: 15
  routed_modalities: [HNMR, CNMR, MSMS, IR]
  empty_action_allowed: false
  target_updates: false
  confidence_threshold: source_validation
student:
  input: [Formula, HNMR, CNMR, MSMS, IR]
  candidates: 4
  sampling:
    temperature: 1.0
    top_p: 0.95
  trainable: full_model
reward:
  canonical_exact: 1.0
  morgan_tanimoto: 0.25
  observed_formula_exact: 0.10
  invalid_penalty: 0.20
  target_smiles_permitted: false
optimization:
  optimizer: AdamW
  learning_rate_candidates_source_only: [1.0e-7, 3.0e-7, 1.0e-6]
  initial_learning_rate: 3.0e-7
  weight_decay: 0.0
  gradient_clip: 1.0
  reset_between_batches: false
output:
  official_decode: beam_10_immediately_after_current_batch_update
  write_each_batch: true
  final_checkpoint_replay_is_main_result: false
