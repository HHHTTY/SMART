Formula:
  type: text
  column: molecular_formula
  target: false
  preprocessor_arguments:
    tokenizer: formula
    tokenizer_regex: ([A-Z]{1}[a-z]?[0-9]*)

MSMS:
  type: msms_text
  column: spectrum
  target: false
  preprocessor_arguments: {}

HNMR:
  type: multiplets
  column: h_nmr_peaks
  target: false
  preprocessor_arguments:
    encoding: text
    j_values: false
    normalise: false

CNMR:
  type: carbon
  column: c_nmr_peaks
  target: false
  preprocessor_arguments:
    intensities: false

IR:
  type: 1D_patches
  column: ir_spectra
  target: false
  preprocessor_arguments:
    patch_size: 75
    interpolation: false
    masking: false

Smiles:
  type: text
  column: smiles
  target: true
  preprocessor_arguments:
    tokenizer: smiles
    tokenizer_regex: (\[[^\]]+]|Br?|Cl?|N|O|S|P|F|I|b|c|n|o|s|p|\(|\)|\.|=|#|-|\+|\\\\|\/|:|~|@|\?|\*|\$|\%[0-9]{2}|[0-9])
